version: '3.8'

services:
  # Database Service
  database:
    image: postgres:15-alpine
    container_name: whitelabel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Backend Service
  backend:
    container_name: whitelabel_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - database
    restart: unless-stopped

  # Frontend Service
  frontend:
    container_name: whitelabel_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BRAND: ${BRAND}
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
